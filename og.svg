<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Evirion - Engineering Decision Memory</title>
  <desc id="description">Your codebase remembers what changed. Evirion remembers why.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#c7cdd3" stroke-opacity=".42"/>
    </pattern>
    <linearGradient id="record" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#f3f1ec"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="#121a24" stroke-width="2"/>

  <g transform="translate(88 82)">
    <circle cx="19" cy="19" r="18" fill="none" stroke="#315f9f" stroke-width="2"/>
    <circle cx="19" cy="19" r="8" fill="#315f9f"/>
    <path d="M19 0v38M0 19h38" stroke="#315f9f" stroke-width="1" opacity=".58"/>
    <text x="52" y="27" fill="#121a24" font-family="Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="5">EVIRION</text>
  </g>

  <text x="88" y="178" fill="#315f9f" font-family="'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="2.5">ENGINEERING DECISION MEMORY | PRIVATE PILOT</text>
  <text x="88" y="253" fill="#121a24" font-family="Georgia, serif" font-size="50" font-weight="700">Your codebase remembers</text>
  <text x="88" y="313" fill="#121a24" font-family="Georgia, serif" font-size="50" font-weight="700">what changed.</text>
  <text x="88" y="394" fill="#315f9f" font-family="Georgia, serif" font-size="55" font-style="italic" font-weight="700">Evirion remembers why.</text>
  <text x="88" y="480" fill="#556270" font-family="Arial, sans-serif" font-size="22">Evidence-backed context for people and AI systems.</text>

  <g transform="translate(824 148)">
    <rect width="274" height="344" fill="url(#record)" stroke="#778493" stroke-width="2"/>
    <rect x="18" y="18" width="238" height="34" fill="#101a27"/>
    <text x="31" y="40" fill="#edf3f8" font-family="'Courier New', monospace" font-size="12" letter-spacing="1.5">DECISION | EDR-018</text>
    <text x="20" y="86" fill="#315f9f" font-family="'Courier New', monospace" font-size="11" font-weight="700">STATE | CANDIDATE</text>
    <text x="20" y="123" fill="#121a24" font-family="Georgia, serif" font-size="22" font-weight="700">Move orchestration</text>
    <text x="20" y="151" fill="#121a24" font-family="Georgia, serif" font-size="22" font-weight="700">behind a queue.</text>
    <path d="M20 177h234M20 237h234M20 297h234" stroke="#c7cdd3"/>
    <text x="20" y="201" fill="#65707d" font-family="'Courier New', monospace" font-size="10">REASON</text>
    <text x="20" y="221" fill="#121a24" font-family="Arial, sans-serif" font-size="13">Protect request latency.</text>
    <text x="20" y="261" fill="#65707d" font-family="'Courier New', monospace" font-size="10">CONSTRAINT</text>
    <text x="20" y="281" fill="#121a24" font-family="Arial, sans-serif" font-size="13">At-least-once delivery.</text>
    <text x="20" y="321" fill="#65707d" font-family="'Courier New', monospace" font-size="10">EVIDENCE</text>
    <circle cx="25" cy="337" r="4" fill="#3f7d68"/>
    <text x="38" y="342" fill="#121a24" font-family="Arial, sans-serif" font-size="12">PR #184 | REVIEWED</text>
  </g>

  <text x="88" y="556" fill="#65707d" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.5">EVIRION.AI</text>
</svg>
